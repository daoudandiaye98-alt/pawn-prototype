<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAWN — Mode, Interior und Kunst. Kuratiert.</title>
    <meta name="description" content="PAWN ist ein kuratierter Marktplatz für unabhängige Designer:innen aus Mode, Interior und Kunst. Kein Ranking, sondern Handschrift." />
    <meta name="author" content="PAWN" />

    <!-- Teil K5 — was hier steht, ist der Grundfall für Abrufer, die kein
         JavaScript ausführen. Sobald die Seite läuft, schreibt
         `src/components/palace/Seo.tsx` jedes dieser Felder je Route neu.

         Bewusst NICHT mehr hier: `canonical` und `og:url` auf „https://pawn.vision/".
         Beide standen fest auf der Startseite und waren damit auf jeder
         Unterseite falsch — ein Abrufer ohne JavaScript las auf
         /product/… , die Seite sei die Startseite. Fehlen beide, nimmt jeder
         Abrufer die tatsächlich abgerufene Adresse. Kein Eintrag ist hier
         richtiger als ein falscher. -->
    <meta property="og:title" content="PAWN — Mode, Interior und Kunst. Kuratiert." />
    <meta property="og:description" content="Ein kuratierter Marktplatz für unabhängige Designer:innen. Kein Ranking, sondern Handschrift." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PAWN" />
    <meta property="og:image" content="https://pawn.vision/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PAWN — Mode, Interior und Kunst" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pawn.vision/og.png" />

    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Schriften laufen komplett lokal über @fontsource (main.tsx) — kein Google-Fonts-Request
         mehr (DSGVO: keine IP-Übertragung an Google, und schneller, weil ein Request wegfällt). -->

    <!-- Google Ads (gtag.js) mit Consent Mode v2: Standard ist ALLES verweigert.
         Erst wenn der Nutzer im PAWN-Consent-Banner "Einverstanden" wählt, hebt
         src/lib/consent.tsx die Einwilligung per gtag('consent','update',…) an. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
      });
      gtag('js', new Date());
      gtag('config', 'AW-18366892645');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18366892645"></script>

    <!-- Plausible — cookieloses Analytics (keine Einwilligung nötig, keine personenbezogenen
         Daten, kein Cookie). Domain muss im Plausible-Konto als pawn.vision angelegt sein. -->
    <script defer data-domain="pawn.vision" src="https://plausible.io/js/script.js"></script>
  </head>


  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
