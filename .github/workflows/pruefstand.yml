# Code wird am Commit geprueft, der Browser am nachgewiesenen Deployment desselben Commits.
name: Prüfstand
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      adresse:
        description: "Optionales Pruefziel auf pawn.vision oder vercel.app; muss diesen Commit ausliefern."
        required: false
        default: ""
      kontrollen:
        description: "Optional: Kontrollen mit Komma, z.B. 3.3,3.5. Leer = voller Lauf."
        required: false
        default: ""
concurrency:
  group: pruefstand-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  deployments: read
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typen, Verhalten und Regressionen
        run: bash scripts/verify/verify.sh schnell
      - name: Fokus-Waechter
        run: node tools/pruefstand/fokus-waechter.mjs
      - name: Produktionsbau
        run: npm run build
      - name: Startgewicht
        run: npm run build:gewicht
      - name: Browser fuer isolierte Funktionstests
        run: npx playwright install --with-deps chromium
      - name: Wege mit isolierten Testantworten
        run: node scripts/verify/wege-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-${{ github.sha }}
          path: tools/pruefstand/artefakte/smoke/
          if-no-files-found: warn
  messen:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ziel und veroeffentlichten Bau bestaetigen
        id: ziel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EINGETRAGEN: ${{ inputs.adresse }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          HAUPTZWEIG: ${{ github.event.repository.default_branch || 'main' }}
        run: node scripts/verify/deployment.mjs
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Pruefstand auf bestaetigtem Deployment
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PAWN_BYPASS_ORIGIN: ${{ steps.ziel.outputs.bypass_origin }}
          ADRESSE: ${{ steps.ziel.outputs.adresse }}
          KONTROLLEN: ${{ inputs.kontrollen }}
        run: |
          teil=()
          if [ -n "$KONTROLLEN" ]; then teil=(--kontrollen "$KONTROLLEN"); fi
          npx tsx tools/pruefstand/lauf.ts --adresse "$ADRESSE" "${teil[@]}" && ende=0 || ende=$?
          if [ "$ende" -eq 3 ]; then
            echo "::error::Kein Urteil: zu wenige Kontrollen waren messbar."
            echo "Kein Urteil ueber diesen Bau; Details im Pruefbericht." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$ende"
      - name: Bericht und Aufnahmen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruefstand-${{ github.run_number }}-${{ github.sha }}
          path: tools/pruefstand/artefakte/
          if-no-files-found: warn
          retention-days: 30
